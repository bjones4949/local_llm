# GTX 1080 server: llama.cpp (CUDA) + AnythingLLM + OneDrive
# vLLM does not support Pascal GPUs (compute capability 6.1), so llama.cpp is used here.
name: local-llm

services:
  anythingllm:
    image: mintplexlabs/anythingllm:${ANYTHINGLLM_TAG:-latest}
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "${ANYTHINGLLM_PORT:-3001}:3001"
    environment:
      STORAGE_DIR: /app/server/storage
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET}
      EMBEDDING_ENGINE: native
      VECTOR_DB: lancedb
      LLM_PROVIDER: generic-openai
      EMBEDDING_BASE_PATH: http://embed:8000/v1
      EMBEDDING_MODEL_PREF: embed-model
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "1000"
      GENERIC_OPEN_AI_EMBEDDING_API_KEY: ${VLLM_API_KEY}
    volumes:
      - anythingllm-storage:/app/server/storage
      - ${ONEDRIVE_DATA_DIR:-/srv/onedrive}:/app/server/storage/anythingllm-fs
    depends_on:
      llm:
        condition: service_healthy

  onedrive:
    image: driveone/onedrive:${ONEDRIVE_TAG:-edge}
    restart: unless-stopped
    environment:
      ONEDRIVE_UID: ${PUID:-1000}
      ONEDRIVE_GID: ${PGID:-1000}
      ONEDRIVE_DOWNLOADONLY: ${ONEDRIVE_DOWNLOADONLY:-1}
    volumes:
      # configuration and data directories
      - ./onedrive/conf:/onedrive/conf
      - ${ONEDRIVE_DATA_DIR:-/srv/onedrive}:/onedrive/data

  embed:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_TAG:-server-cuda}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm-models:/models
    command:
      - -hf
      - ${EMBED_GGUF:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      - --alias
      - embed-model
      - --embedding
      - --pooling
      - last
      - -c
      - "8192"
      - -b
      - "2048"
      - -ub
      - "2048"
      - -ngl
      - "99"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  llm:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_TAG:-server-cuda}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm-models:/models
    command:
      - -hf
      - ${LLM_GGUF:-bartowski/Qwen2.5-7B-Instruct-GGUF:Q4_K_M}
      - --alias
      - local-model
      - -c
      - "8192"
      - -ngl
      - "99"
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  anythingllm-storage:
  llm-models: